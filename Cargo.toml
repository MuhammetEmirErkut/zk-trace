[workspace]
resolver = "2"
members = [
    "crates/zktrace-core",
    "crates/zktrace-circuits",
    "crates/zktrace-prover",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["ZKTrace Maintainers <maintainers@zktrace.io>"]
license = "Apache-2.0"
homepage = "https://zktrace.io"
repository = "https://github.com/zktrace/zktrace"
keywords = ["zero-knowledge", "mcp", "ai-agents", "cryptography", "audit-trail"]
categories = ["cryptography", "development-tools"]

[workspace.dependencies]
# Cryptography & Zero-Knowledge (Arkworks Ecosystem)
ark-ff = { version = "0.4.2", default-features = false }
ark-bn254 = { version = "0.4.0", default-features = false }
ark-crypto-primitives = { version = "0.4.0", default-features = false, features = ["sponge", "r1cs"] }
ark-std = { version = "0.4.0", default-features = false }
ark-serialize = { version = "0.4.2", default-features = false, features = ["derive"] }
ark-relations = { version = "0.4.0", default-features = false }
ark-r1cs-std = { version = "0.4.0", default-features = false }
ark-groth16 = { version = "0.4.0", default-features = false }

# Serialization & Data Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = { version = "0.4", features = ["serde"] }

# Utilities & Error Handling
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
sha2 = "0.10"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Internal workspace crates
zktrace-core = { path = "crates/zktrace-core" }
zktrace-circuits = { path = "crates/zktrace-circuits" }
zktrace-prover = { path = "crates/zktrace-prover" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = true
